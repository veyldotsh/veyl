# Dedicated Veyl host only. Do not replace the machine's global nginx config.
server {
    listen 443 ssl;
    server_name runtime.veyl.sh;
    ssl_certificate /etc/letsencrypt/live/runtime.veyl.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runtime.veyl.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 40k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 55s;
        proxy_send_timeout 10s;
    }
}
server {
    listen 80;
    server_name runtime.veyl.sh;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/lib/veyl-acme; }
    location / { return 301 https://$host$request_uri; }
}
