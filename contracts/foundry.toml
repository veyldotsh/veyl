[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/", "v4-core/=lib/v4-core/", "@uniswap/v4-core/=lib/v4-core/", "v4-periphery/=lib/v4-periphery/", "solmate/=lib/solmate/"]
[fuzz]
runs = 256
