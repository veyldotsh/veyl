name: Veyl checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VEYL_MAINNET_FORK: 'false'
      VEYL_ENABLE_MAINNET_TRANSACTIONS: 'false'
      VEYL_ENABLE_ZKAPI_APPROVAL: 'false'
      VEYL_ENABLE_SOCIAL_PUBLISHING: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
          cache: false
      - run: npm ci
      - run: npm run setup:contracts
      - run: forge fmt --root contracts --check
      - run: forge build --root contracts --sizes
      - run: forge test --root contracts
      - run: npm test
      - run: npm run build
